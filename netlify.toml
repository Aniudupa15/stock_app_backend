# Netlify config (repo root, where Netlify auto-detects it). Monorepo: the
# build runs inside apps/flutter. netlify_build.sh installs Flutter (Netlify's
# image has no SDK), generates web scaffolding, and builds with the backend
# URLs baked in via --dart-define.
#
# Set these in Netlify (Site settings -> Environment) or via the CLI to your
# deployed backend URLs:
#   DATA_BASE_URL     e.g. https://data-service-xxxx.onrender.com
#   TRADING_BASE_URL  e.g. https://trading-service-xxxx.onrender.com

[build]
  base = "apps/flutter"
  command = "bash netlify_build.sh"
  publish = "build/web"

# Single-page app: every route falls back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
