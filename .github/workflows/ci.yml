name: CI

# Run on every push (any branch) and every pull request.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      # tests/conftest.py's `postgres_url` fixture spins up an ephemeral
      # Postgres via testcontainers; ubuntu-latest runners have Docker.
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
        run: pytest -q
